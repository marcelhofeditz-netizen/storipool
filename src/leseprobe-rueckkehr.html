<h3>Vorwort – Und ich?</h3>
<p>Vielleicht kennst du dieses Gefühl.</p>
<p>Es ist spät. Du liegst auf dem Sofa, das Handy in der Hand, und liest wieder so eine Schlagzeile. Eine Bank streicht Tausende Stellen und ersetzt sie durch KI. Ein Programm hat das Examen bestanden, für das du jahrelang gelernt hast. Ein Konzernchef sagt, in fünf Jahren werde die Hälfte aller Bürojobs verschwinden. Du legst das Handy weg. Du schaltest den Fernseher ein, dann wieder aus. Und dann kommt diese Frage, die du niemandem stellst. Nicht deinem Partner, nicht deinen Kollegen, nicht einmal dir selbst, jedenfalls nicht laut:</p>
<p><em>Und ich?</em></p>
<p>Bin ich der Nächste? Ist das, was ich in zwanzig Jahren gelernt habe, morgen noch etwas wert? Was sage ich meinen Kindern, wofür sie sich anstrengen sollen? Und warum, verdammt, bin ich gleichzeitig so neugierig auf genau das, was mir Angst macht?</p>
<p>Ich kenne dieses Gefühl. Ich hatte es in diesem Jahr jeden einzelnen Tag. Nur von der anderen Seite.</p>
<p>Ich bin einer von denen, die es tun.</p>
<p>Ich bin Immobilienmakler in Hamburg. Meine Firma hat genau einen Angestellten: mich. Und trotzdem arbeitet sie Tag und Nacht. Sie schreibt Hunderte Mails pro Woche, entwirft Verträge, bewertet Immobilien, pflegt Datenbanken, baut Software, bereitet meine Buchhaltung vor und erinnert mich morgens daran, was heute wichtig ist. Nicht, weil ich zwanzig Menschen eingestellt hätte. Sondern weil ich ein Jahr lang Maschinen beigebracht habe, wie meine Firma funktioniert.</p>
<p>Das klingt nach einer Erfolgsgeschichte. Es ist auch eine. Aber es ist nicht die ganze Geschichte.</p>
<p>Die ganze Geschichte ist: Ich habe in diesem Jahr Nächte erlebt, in denen ich um drei Uhr früh allein vor dem Laptop gelacht habe, weil etwas funktioniert hat, das gestern noch unmöglich war. Und ich habe in derselben Sekunde Angst gehabt. Angst, dass das, was ich baue, morgen keiner mehr braucht. Angst, dass ich der Maschine Arbeit gebe, die früher Menschen gemacht haben, die ich kenne. Angst, dass ich mich selbst verliere in einem Rausch aus achtzehn Stunden Arbeit und vier Stunden Schlaf. Ich habe gekocht und dabei an Code gedacht. Ich habe Gute-Nacht-Geschichten vorgelesen und dabei an Datenbanktabellen gedacht. Ich habe mich nie so lebendig gefühlt. Und selten so allein.</p>
<p>Genau davon handelt dieses Buch.</p>
<h3 style="margin-top:28px">Prolog – Eine Nacht in der leeren Firma</h3>
<p class="when">November 2026, 2:47 Uhr</p>
<p>Das Telefon vibriert. Ich schaue nicht hin. Ich weiß, was es ist: Eine Maschine hat gerade eine Aufgabe erledigt, die ich ihr vor einer Stunde gegeben habe. Sie meldet sich, höflich wie immer, und wartet auf die nächste.</p>
<p>Ich sitze im Dunkeln. Nur der Bildschirm leuchtet. Auf ihm sind vier Fenster geöffnet, und in jedem arbeitet etwas, das kein Mensch ist.</p>
<p>Im ersten Fenster entstehen Antworten auf die Mails, die heute gekommen sind. Ein Investor aus München will ein Exposé. Ein Makler aus Köln will ein Grundstück mit mir gemeinsam verkaufen. Eine Bank bestätigt einen Termin. Die einfachen Antworten sind schon raus, in meinem Ton, mit meiner Unterschrift. Die schwierigen warten auf mich, jede mit einem Vorschlag dahinter. Ich muss morgen früh nur noch zwei Worte schreiben: „mach so“.</p>
<p>Im zweiten Fenster baut eine Maschine eine neue Funktion für meine Plattform. Sie schreibt den Code, testet ihn, findet ihre eigenen Fehler. Vor einem Jahr hätte ich dafür eine Agentur gebraucht, drei Angebote, zwei Monate, eine Rechnung höher als das Angebot. Heute brauche ich einen Satz.</p>
<p>Im dritten Fenster entsteht ein Text, der morgen um halb neun auf LinkedIn erscheint. Eine provokante These über die Zukunft der Arbeit. Ich werde schlafen, wenn sie online geht. Wenn ich schlafe.</p>
<p>Im vierten Fenster: dieses Buch.</p>
<p>Ich lehne mich zurück. Und dann kommt es wieder, dieses Gefühl, das ich in diesem Jahr so oft hatte, dass ich ihm einen Namen geben möchte. Es ist Stolz. Unfassbarer Stolz, dass das funktioniert. Dass ein Makler ohne Programmierkenntnisse, ohne Investoren, ohne Team eine Firma betreibt, die früher zwanzig Leute gebraucht hätte. Und es ist, im selben Atemzug, in derselben Sekunde, Angst. Was heißt das für die zwanzig, die ich nie einstellen werde? Für die Assistentin, die Sachbearbeiterin, den Junior, die es in meiner Firma nie geben wird? Für all die Menschen, die gerade in einem Büro sitzen und glauben, ihr Job sei sicher, weil er gestern sicher war?</p>
<p>Und was heißt es für mich? Ich habe heute um elf angefangen. Jetzt ist es fast drei. Ich habe gegessen, ohne zu schmecken. Ich habe gesprochen, ohne zuzuhören. Ich war den ganzen Tag beschäftigt und habe mit keinem Menschen wirklich geredet.</p>
<p>Ich stelle mir meine Firma als Raum vor. Eine riesige Büroetage, lange Reihen von Schreibtischen, und kein einziger Mensch. Aber auf jedem Tisch leuchtet ein Bildschirm, als würden unsichtbare Kollegen arbeiten. Sie ist leer. Und sie ist voll. Und ich sitze mittendrin und weiß nicht, ob ich gerade die Zukunft erfinde oder mich in ihr verliere.</p>
<p>Das Telefon vibriert wieder. Diesmal ist es kein Programm. Es ist eine Nachricht von einem Mann, den ich kaum kenne. Er hat meinen Beitrag von heute Morgen gelesen. Er schreibt nur einen Satz:</p>
<p><em>Ist mein Job in fünf Jahren noch da?</em></p>
<p>Ich starre lange auf diese Zeile. Ich habe keine Antwort. Ich habe nur dieses Jahr. Und das will ich erzählen.</p>
<p>Ich klappe den Laptop zu. Die Arbeit läuft trotzdem weiter.</p>
