<!doctype html><html lang="de"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hörbücher hochladen</title><style>body{font-family:system-ui,sans-serif;background:#0B0A12;color:#eee;max-width:560px;margin:0 auto;padding:28px 20px}h1{font-size:24px}.b{border:1px solid #444;border-radius:12px;padding:16px;margin:16px 0}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;color:#eee}button{background:#F2B544;color:#111;border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:16px;width:100%;margin-top:8px}.p{font-size:14px;color:#bbb;margin-top:8px;white-space:pre-line}progress{width:100%}</style></head><body><h1>Hörbücher hochladen</h1><p class="p">MP3s auswählen (bei Kapiteln mehrere auf einmal) und auf Hochladen tippen. Große Dateien werden automatisch in Teile zerlegt. Seite offen lassen, bis alles fertig ist.</p><div class="b"><label>Die Rückkehr</label><input type="file" id="f1" accept="audio/*,.mp3,.m4a,.m4b" multiple></div><div class="b"><label>Das Ganze</label><input type="file" id="f2" accept="audio/*,.mp3,.m4a,.m4b" multiple></div><button id="go">Hochladen</button><progress id="pr" value="0" max="1" hidden></progress><div class="p" id="st"></div><script>const T=new URLSearchParams(location.search).get('t')||new URLSearchParams(location.hash.slice(1)).get('t');const st=document.getElementById('st'),pr=document.getElementById('pr');
const PART=30*1024*1024;
function put(url,blob,type){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('content-type',type);x.setRequestHeader('x-upsert','true');x.upload.onprogress=e=>{if(e.lengthComputable){pr.max=e.total;pr.value=e.loaded;}};x.onload=()=>x.status<300?res():rej(new Error(x.status+' '+x.responseText.slice(0,200)));x.onerror=()=>rej(new Error('Netzwerkfehler'));x.send(blob);});}
async function syncAt(f,c){const b=new Uint8Array(await f.slice(c,c+65536).arrayBuffer());for(let i=0;i<b.length-1;i++){if(b[i]===0xFF&&(b[i+1]&0xE0)===0xE0)return c+i;}return c;}
async function teile(f){if(f.size<=PART)return [[0,f.size]];const cuts=[0];let c=PART;while(c<f.size-PART/4){cuts.push(await syncAt(f,c));c+=PART;}cuts.push(f.size);const out=[];for(let i=0;i<cuts.length-1;i++)out.push([cuts[i],cuts[i+1]]);return out;}
async function sign(buch,name){const r=await fetch('https://rfldzzgeikcntmhvwjwk.supabase.co/functions/v1/tmp-buch-upload?t='+encodeURIComponent(T)+'&a=sign',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({buch,name})});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j.url;}
document.getElementById('go').onclick=async()=>{const jobs=[];for(const [id,buch] of [['f1','die-rueckkehr'],['f2','das-ganze']])for(const f of document.getElementById(id).files)jobs.push([buch,f]);if(!jobs.length){st.textContent='Bitte zuerst Dateien wählen.';return;}pr.hidden=false;let log='';
 for(const [buch,f] of jobs){try{const parts=await teile(f);const base=f.name.replace(/\.[^.]+$/,'');const ext=(f.name.match(/\.[^.]+$/)||['.mp3'])[0];const type=f.type||'audio/mpeg';
  for(let i=0;i<parts.length;i++){const name=parts.length>1?base+'_Teil_'+String(i+1).padStart(2,'0')+ext:f.name;st.textContent=log+'Lade '+name+(parts.length>1?' ('+(i+1)+'/'+parts.length+')':'')+' …';await put(await sign(buch,name),f.slice(parts[i][0],parts[i][1],type),type);}
  log+='✓ '+f.name+(parts.length>1?' – in '+parts.length+' Teilen':'')+'\n';}catch(e){log+='✗ '+f.name+': '+e.message+'\n';}}
 st.textContent=log+'Fertig. Du kannst Claude jetzt Bescheid sagen.';};
</script></body></html>
